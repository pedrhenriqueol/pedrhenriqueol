<text x="30" y="31" font-size="15" fill="#7aa2f7" >[04] ~/engenharia</text><text x="968" y="31" font-size="15" fill="#9097a4" text-anchor="end">implementar · validar · medir</text><path d="M1 50H999" stroke="#282d36"/><text x="38" y="95" font-size="21" fill="#7aa2f7" >01 / qualidade</text><text x="375" y="93" font-size="20" fill="#eef0f4" >&gt; Contratos JSON Schema / OpenAPI</text><text x="375" y="120" font-size="20" fill="#eef0f4" >&gt; Testes e automação de APIs</text><text x="375" y="147" font-size="20" fill="#eef0f4" >&gt; Asserções com Postman / Runner</text><path d="M38 169H962" stroke="#282d36"/><text x="38" y="206" font-size="21" fill="#7aa2f7" >02 / arquitetura</text><text x="375" y="204" font-size="20" fill="#eef0f4" >&gt; Node.js e PHP / Laravel</text><text x="375" y="231" font-size="20" fill="#eef0f4" >&gt; React, TypeScript e Tailwind</text><text x="375" y="258" font-size="20" fill="#eef0f4" >&gt; Consultas SQL e sistemas legados</text><path d="M38 280H962" stroke="#282d36"/><text x="38" y="317" font-size="21" fill="#7aa2f7" >03 / resiliência</text><text x="375" y="315" font-size="20" fill="#eef0f4" >&gt; Idempotência e HMAC-SHA256</text><text x="375" y="342" font-size="20" fill="#eef0f4" >&gt; Injeção de latência e falhas</text><text x="375" y="369" font-size="20" fill="#eef0f4" >&gt; Métricas de desempenho e SLA</text></svg>