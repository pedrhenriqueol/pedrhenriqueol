<text x="30" y="31" font-size="15" fill="#7aa2f7" >[01.1] ~/paystream</text><text x="968" y="31" font-size="15" fill="#9097a4" text-anchor="end">abrir repositório ↗</text><path d="M1 50H999" stroke="#282d36"/><text x="47" y="86" font-size="19" fill="#9097a4" xml:space="preserve">       PIX</text><text x="47" y="107" font-size="19" fill="#9097a4" xml:space="preserve">        │</text><text x="47" y="128" font-size="19" fill="#9097a4" xml:space="preserve">  ┌─────┴─────┐</text><text x="47" y="149" font-size="19" fill="#9097a4" xml:space="preserve">  │   split   │</text><text x="47" y="170" font-size="19" fill="#9097a4" xml:space="preserve">  └──┬─────┬──┘</text><text x="47" y="191" font-size="19" fill="#9097a4" xml:space="preserve">     ↓     ↓</text><text x="47" y="212" font-size="19" fill="#9097a4" xml:space="preserve">    A       B</text><text x="342" y="100" font-size="34" fill="#eef0f4" >PayStream Gateway</text><text x="342" y="128" font-size="15" fill="#7aa2f7" >fintech / pagamentos</text><text x="342" y="166" font-size="20" fill="#eef0f4" >Pix e split para marketplaces, com idempotência</text><text x="342" y="194" font-size="20" fill="#eef0f4" >e webhooks assinados via HMAC-SHA256.</text><text x="342" y="232" font-size="16" fill="#9097a4" >fastify · typescript · prisma · postgresql · react</text></svg>