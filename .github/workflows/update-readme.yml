name: Atualizar contribuições do perfil

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atualizar os cartões
        run: python .github/scripts/build_readme.py --refresh
      - name: Salvar calendário atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar contribuições do perfil"
            git push origin HEAD:main
          fi
