set="75" class="focus"/><path d="M216 115V129M223 115V129" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="island"><rect x="78" y="46" width="132" height="23" rx="12" fill="#1c1c1c" stroke="#555555"/><circle cx="93" cy="57" r="2" fill="#e0e0e0" stroke="#e0e0e0" /><text x="112" y="61" font-size="9" fill="#f3f3f3" text-anchor="start" >ilha dinâmica</text></g><text x="144" y="208" font-size="12" fill="#9f9f9f" text-anchor="middle" >hábitos · finanças · local</text></g><path d="M324 76V282" fill="none" stroke="#2e2e2e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="342" y="287" font-size="12" fill="#6d6d6d" text-anchor="start" >TAREFAS / FOCO / FINANÇAS</text><path d="M24 298H976" fill="none" stroke="#2e2e2e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="325" font-size="14" fill="#9f9f9f" text-anchor="start" >seu dia, no seu dispositivo</text><text x="976" y="325" font-size="14" fill="#e0e0e0" text-anchor="end" >ver projeto ↗</text></svg>