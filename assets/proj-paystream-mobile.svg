<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">PayStream Gateway</title><desc id="desc">PayStream Gateway · Pix e split para marketplaces, com idempotência e webhooks assinados via HMAC-SHA256. Stack: fastify · typescript · prisma · postgresql · react</desc>
<defs><pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse"><path d="M0 0H4" stroke="#fff" stroke-opacity=".018"/></pattern></defs>
<style>text{font-family:'DejaVu Sans Mono','Liberation Mono',Consolas,monospace;font-variant-ligatures:none}
.flow{animation:flow 5s linear infinite}
.flow-delayed{animation:flow 5s linear infinite -2.5s}
.radar{animation:radar 12s linear infinite;transform-origin:144px 113px}
.beacon{animation:beacon 4s ease-in-out infinite}
.beacon-late{animation:beacon 4s ease-in-out infinite -2s}
.test-row{animation:testRow 8s ease-in-out infinite}
.test-row.second{animation-delay:-5.3s}
.test-row.third{animation-delay:-2.6s}
.trace{animation:trace 8s linear infinite}
.orbit{animation:orbit 16s linear infinite;transform-origin:144px 116px}
.island{animation:island 6s ease-in-out infinite}
.focus{animation:focus 12s ease-in-out infinite}
.access{animation:access 6s ease-in-out infinite}
.access.second{animation-delay:-2s}
.access.third{animation-delay:-4s}
@keyframes flow{to{stroke-dashoffset:-240}}
@keyframes radar{to{transform:rotate(360deg)}}
@keyframes beacon{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes testRow{0%,22%,100%{opacity:.6}30%,55%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-160}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes island{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes focus{0%,100%{stroke-dashoffset:75}50%{stroke-dashoffset:12}}
@keyframes access{0%,100%{opacity:.65}35%,65%{opacity:1}}
@media(prefers-reduced-motion:reduce){
.flow,.flow-delayed,.radar,.beacon,.beacon-late,.test-row,.trace,.orbit,.island,.focus,.access{animation:none!important}
}
</style>
<rect x="1" y="1" width="598" height="598" rx="10" fill="#090b0e" stroke="#2a2e35"/><rect x="2" y="2" width="596" height="596" rx="9" fill="url(#scan)"/><text x="24" y="30" font-size="14" fill="#9a9fa8" text-anchor="start" >[01.1] ~/paystream</text><text x="576" y="30" font-size="12" fill="#676e79" text-anchor="end" >PROJETO</text><path d="M1 48H599" fill="none" stroke="#2a2e35" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="92" font-size="32" fill="#f1f3f5" text-anchor="start" >PayStream Gateway</text><text x="32" y="122" font-size="16" fill="#b1e4d0" text-anchor="start" >fintech / pagamentos</text><text x="32" y="164" font-size="21" fill="#f1f3f5" text-anchor="start" >Pix e split para marketplaces, com</text><text x="32" y="192" font-size="21" fill="#f1f3f5" text-anchor="start" >idempotência e webhooks assinados via</text><text x="32" y="220" font-size="21" fill="#f1f3f5" text-anchor="start" >HMAC-SHA256.</text><text x="32" y="254" font-size="17" fill="#9a9fa8" text-anchor="start" >fastify · typescript · prisma · postgresql ·</text><text x="32" y="278" font-size="17" fill="#9a9fa8" text-anchor="start" >react</text><g transform="translate(156 302)"><rect x="0" y="0" width="288" height="226" rx="8" fill="#0d1014" stroke="#232830"/><text x="18" y="27" font-size="12" fill="#676e79" text-anchor="start" >01 / FLUXO PIX</text><rect x="99" y="38" width="90" height="34" rx="7" fill="#111419" stroke="#2a2e35"/><text x="144" y="60" font-size="15" fill="#b1e4d0" text-anchor="middle" >PIX</text><path d="M144 69V99Q144 111 132 111H74Q62 111 62 123V150" fill="none" stroke="#2a2e35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M144 69V99Q144 111 156 111H214Q226 111 226 123V150" fill="none" stroke="#2a2e35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M144 69V99Q144 111 132 111H74Q62 111 62 123V150" fill="none" stroke="#b1e4d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 115" class="flow"/><path d="M144 69V99Q144 111 156 111H214Q226 111 226 123V150" fill="none" stroke="#b1e4d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 115" class="flow-delayed"/><rect x="108" y="94" width="72" height="32" rx="7" fill="#151b1b" stroke="#435b53"/><text x="144" y="115" font-size="13" fill="#b1e4d0" text-anchor="middle" >split</text><rect x="24" y="150" width="76" height="34" rx="7" fill="#111419" stroke="#2a2e35"/><text x="62" y="172" font-size="12" fill="#f1f3f5" text-anchor="middle" >seller A</text><rect x="188" y="150" width="76" height="34" rx="7" fill="#111419" stroke="#2a2e35"/><text x="226" y="172" font-size="12" fill="#f1f3f5" text-anchor="middle" >seller B</text><circle cx="144" cy="166" r="13" fill="none" stroke="#435b53" /><path d="M138 166L142 170L150 161" fill="none" stroke="#b1e4d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="144" y="208" font-size="12" fill="#9a9fa8" text-anchor="middle" >idempotência · HMAC</text></g><path d="M24 554H576" fill="none" stroke="#2a2e35" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="24" y="581" font-size="12" fill="#9a9fa8" text-anchor="start" >pagamentos com rastreabilidade</text><text x="576" y="581" font-size="12" fill="#b1e4d0" text-anchor="end" >ver projeto ↗</text></svg>