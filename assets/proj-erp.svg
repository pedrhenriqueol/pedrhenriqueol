<text x="30" y="31" font-size="15" fill="#dddddd" >[01.4] ~/retaguarda-erp</text><text x="968" y="31" font-size="15" fill="#999999" text-anchor="end">experiência profissional</text><path d="M1 50H999" stroke="#292929"/><text x="47" y="91" font-size="19" fill="#999999" xml:space="preserve">  ┌───────────┐</text><text x="47" y="112" font-size="19" fill="#999999" xml:space="preserve">  │    ERP    │</text><text x="47" y="133" font-size="19" fill="#999999" xml:space="preserve">  ├───────────┤</text><text x="47" y="154" font-size="19" fill="#999999" xml:space="preserve">  │ RBAC      │</text><text x="47" y="175" font-size="19" fill="#999999" xml:space="preserve">  │ MULTI     │</text><text x="47" y="196" font-size="19" fill="#999999" xml:space="preserve">  │ TENANT    │</text><text x="47" y="217" font-size="19" fill="#999999" xml:space="preserve">  └───────────┘</text><text x="342" y="100" font-size="34" fill="#f5f5f5" >Retaguarda ERP</text><text x="342" y="128" font-size="15" fill="#dddddd" >experiência / sistemas corporativos</text><text x="342" y="166" font-size="20" fill="#f5f5f5" >Painéis administrativos, permissões granulares</text><text x="342" y="194" font-size="20" fill="#f5f5f5" >e otimização de consultas em bancos relacionais.</text><text x="342" y="232" font-size="16" fill="#999999" >laravel · react · typescript · sql server · docker</text><g class="heartbeat"><rect x="231" y="168" width="6" height="6" rx="0" fill="#f5f5f5" stroke="none"/></g></svg>